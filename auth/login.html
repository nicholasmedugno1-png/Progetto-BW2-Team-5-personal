<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes - Accedi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/auth.css" />

    <script type="module" src="./login.js"></script>
  </head>

  <body>
    <main class="auth-container">
      <div class="auth-card p-4 p-sm-5">
        <div class="auth-brand mb-4 mb-sm-5">
          <div class="auth-logo">E</div>
          <span>EpiTunes</span>
        </div>

        <div class="auth-heading">
          <h1 class="fs-4">Bentornato!</h1>
          <p>Accedi al tuo account per continuare ad ascoltare.</p>
        </div>

        <form>
          <div class="auth-fields">
            <div class="auth-input-wrapper">
              <input
                type="email"
                id="userEmail"
                class="form-control"
                placeholder="Inserisci l'email di registrazione"
              />
            </div>

            <div class="auth-input-wrapper">
              <input
                type="password"
                id="userPass"
                class="form-control"
                placeholder="Inserisci la password"
              />
            </div>
          </div>

          <div class="auth-actions mt-3">
            <button
              type="submit"
              class="btn btn-success auth-submit"
              id="userLogin"
            >
              Accedi
            </button>

            <div class="auth-divider">oppure</div>

            <button type="button" class="btn btn-info mb-2" id="userRegister">
              Registrati
            </button>
          </div>
        </form>
        <h2 id="loginError" class="pb-2"></h2>
        <div
          id="spinnerLog"
          class="d-none d-flex align-items-center justify-content-center"
        >
          <span role="status">Caricamento...</span>
          <div class="spinner-border text-warning ms-2" role="status"></div>
        </div>
      </div>
    </main>
  </body>
</html>
