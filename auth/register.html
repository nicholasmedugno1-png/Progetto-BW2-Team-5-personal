<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpiTunes - Registrati</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/auth.css" />

    <script type="module" src="./register.js"></script>
  </head>

  <body>
    <main class="auth-container">
      <div class="auth-card p-4 p-sm-5">
        <div class="auth-brand mb-4 mb-sm-5">
          <div class="auth-logo">E</div>
          <span>EpiTunes</span>
        </div>

        <div class="auth-heading">
          <h1 class="fs-4">Crea il tuo account</h1>
          <p>Registrati e inizia ad ascoltare la tua musica preferita.</p>
        </div>

        <form>
          <div class="auth-fields">
            <div class="auth-input-wrapper">
              <input
                type="text"
                id="userName"
                class="form-control"
                placeholder="Inserisci il nome completo"
              />
            </div>

            <div class="auth-input-wrapper">
              <input
                type="email"
                id="userEmail"
                class="form-control"
                placeholder="Inserisci l'email"
              />
            </div>

            <div class="auth-input-wrapper">
              <input
                type="password"
                id="userPass"
                class="form-control"
                placeholder="Scegli una password"
              />
            </div>

            <button type="submit" class="btn btn-success auth-submit">
              Registrati
            </button>
            <div class="auth-divider">oppure</div>

            <button type="button" class="btn btn-info" id="userRegister">
              Accedi
            </button>
          </div>
        </form>

        <h3 id="regMessage"></h3>
      </div>
    </main>
  </body>
</html>
